# Production Docker Compose
# Requires a .env file with:
#   MONGO_URL=<your MongoDB Atlas connection string>
#   REDIS_URL=<your Redis URL>
#   JWT_SECRET=<long random secret>
#   OPENROUTER_API_KEY=<your key>

services:
  backend:
    image: ghcr.io/thehustlehouse-hq/atlars-backend:latest
    container_name: atlars_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2

  worker:
    image: ghcr.io/thehustlehouse-hq/atlars-backend:latest
    container_name: atlars_worker
    env_file:
      - .env
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q daily,weekly,monthly --loglevel=info --concurrency=2

  beat:
    image: ghcr.io/thehustlehouse-hq/atlars-backend:latest
    container_name: atlars_beat
    env_file:
      - .env
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
